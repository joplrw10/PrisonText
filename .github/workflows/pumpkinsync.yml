name: PumpkinSync tests

on:
  push:
    paths:
      - "PumpkinSync/**"
      - ".github/workflows/pumpkinsync.yml"
  pull_request:
    paths:
      - "PumpkinSync/**"
      - ".github/workflows/pumpkinsync.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: PumpkinSync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PumpkinSync/pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install PumpkinSync
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
